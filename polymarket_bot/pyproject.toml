[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-arb-bot"
version = "0.1.0"
description = "Read-first Polymarket arbitrage and wallet intelligence bot"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "tenacity>=8.2.0",
  "cachetools>=5.3.0",
  "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14"]

[project.scripts]
polymarket-bot = "src.main:app"

[tool.pytest.ini_options]
pythonpath = [".", "polymarket_bot"]
